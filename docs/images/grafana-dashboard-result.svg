<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Grafana dashboard result</title>
  <desc id="desc">Dark themed monitoring dashboard showing CPU and memory usage charts for EKS cluster.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#111922"/>
      <stop offset="100%" stop-color="#0d141d"/>
    </linearGradient>
    <linearGradient id="goldArea" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f2d65b" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#d4a91d" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="greenArea" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#5ac2a4" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#2a8f73" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="blueArea" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#3e78ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1d3d7a" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad)"/>

