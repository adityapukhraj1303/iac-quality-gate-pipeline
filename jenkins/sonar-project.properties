# ==============================================================================
# SonarQube Static Code Analysis Configuration (ShellCheck + Shell Analysis)
# ==============================================================================

sonar.projectKey=iac-quality-gate-pipeline
sonar.projectName=Infrastructure-as-Code Quality Gate & Auto-Deployment Pipeline
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=app,scripts
sonar.inclusions=**/*.sh

# Exclusions
sonar.exclusions=**/*.tf,**/*.tfstate*,**/.terraform/**

# Encoding
sonar.sourceEncoding=UTF-8

# ShellCheck & Static Analysis Rules
sonar.shellcheck.enabled=true
sonar.qualitygate.wait=true

# Quality Gate Thresholds
# Maximum allowable critical/blocker issues: 0
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*test*
